<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" font-family="Georgia, 'Times New Roman', serif">
  <rect width="820" height="460" fill="#fbfaf7"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" fill="#23303c">8259A — eight requests in, one interrupt out</text>

  <defs>
    <marker id="a49" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#23303c"/>
    </marker>
    <marker id="a49r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#b4562d"/>
    </marker>
  </defs>

  <rect x="250" y="62" width="300" height="300" rx="5" fill="#eceae4" stroke="#23303c" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-size="16" fill="#23303c">8259A</text>
  <line x1="250" y1="98" x2="550" y2="98" stroke="#9aa4ae"/>

  <rect x="270" y="110" width="110" height="46" rx="3" fill="#dfe6ea" stroke="#8a939d"/>
  <text x="325" y="130" text-anchor="middle" font-size="12" fill="#23303c">IRR</text>
  <text x="325" y="147" text-anchor="middle" font-size="10" fill="#6b747e">who is asking</text>

  <rect x="270" y="166" width="110" height="46" rx="3" fill="#f2e7df" stroke="#8a939d"/>
  <text x="325" y="186" text-anchor="middle" font-size="12" fill="#23303c">IMR</text>
  <text x="325" y="203" text-anchor="middle" font-size="10" fill="#b4562d">1 = masked off</text>

  <rect x="270" y="222" width="110" height="46" rx="3" fill="#dfe6ea" stroke="#8a939d"/>
  <text x="325" y="242" text-anchor="middle" font-size="12" fill="#23303c">ISR</text>
  <text x="325" y="259" text-anchor="middle" font-size="10" fill="#6b747e">being served</text>

  <rect x="270" y="280" width="110" height="60" rx="3" fill="#e4eaee" stroke="#8a939d"/>
  <text x="325" y="302" text-anchor="middle" font-size="11.5" fill="#23303c">priority</text>
  <text x="325" y="318" text-anchor="middle" font-size="11.5" fill="#23303c">resolver</text>
  <text x="325" y="334" text-anchor="middle" font-size="10" fill="#6b747e">IR0 highest</text>

  <rect x="398" y="110" width="134" height="110" rx="3" fill="#e4eaee" stroke="#8a939d"/>
  <text x="465" y="134" text-anchor="middle" font-size="12" fill="#23303c">control logic</text>
  <text x="465" y="156" text-anchor="middle" font-size="10.5" fill="#6b747e">ICW1–ICW4</text>
  <text x="465" y="172" text-anchor="middle" font-size="10.5" fill="#6b747e">OCW1–OCW3</text>
  <text x="465" y="196" text-anchor="middle" font-size="10.5" fill="#b4562d">type number =</text>
  <text x="465" y="210" text-anchor="middle" font-size="10.5" fill="#b4562d">ICW2 + IR number</text>

  <rect x="398" y="234" width="134" height="60" rx="3" fill="#dfe6ea" stroke="#8a939d"/>
  <text x="465" y="256" text-anchor="middle" font-size="11.5" fill="#23303c">cascade buffer</text>
  <text x="465" y="274" text-anchor="middle" font-size="10.5" fill="#6b747e">CAS0–CAS2</text>

  <!-- IR inputs -->
  <g stroke="#b4562d" stroke-width="1.8" marker-end="url(#a49r)">
    <line x1="150" y1="118" x2="248" y2="118"/>
    <line x1="150" y1="140" x2="248" y2="140"/>
    <line x1="150" y1="162" x2="248" y2="162"/>
    <line x1="150" y1="206" x2="248" y2="206"/>
  </g>
  <g font-size="12" font-family="monospace" fill="#b4562d" text-anchor="end">
    <text x="144" y="122">IR0</text>
    <text x="144" y="144">IR1</text>
    <text x="144" y="166">IR2</text>
    <text x="144" y="210">IR7</text>
  </g>
  <text x="130" y="186" text-anchor="end" font-size="14" fill="#9aa4ae">⋮</text>
  <text x="90" y="240" text-anchor="middle" font-size="11" fill="#6b747e">eight devices</text>

  <!-- data / control -->
  <g stroke="#23303c" stroke-width="1.8" marker-end="url(#a49)">
    <line x1="150" y1="290" x2="248" y2="290"/>
    <line x1="150" y1="326" x2="248" y2="326"/>
  </g>
  <g font-size="11.5" font-family="monospace" fill="#23303c" text-anchor="end">
    <text x="144" y="294">D7–D0</text>
    <text x="144" y="330">CS RD WR A0</text>
  </g>

  <!-- outputs -->
  <line x1="552" y1="140" x2="680" y2="140" stroke="#2f6f6b" stroke-width="2.4" marker-end="url(#a49)"/>
  <text x="688" y="144" font-size="12" font-family="monospace" fill="#2f6f6b">INT</text>
  <text x="688" y="160" font-size="10.5" fill="#6b747e">→ the 8086's INTR pin</text>

  <line x1="680" y1="184" x2="552" y2="184" stroke="#b4562d" stroke-width="2" marker-end="url(#a49r)"/>
  <text x="688" y="188" font-size="12" font-family="monospace" fill="#b4562d">INTA</text>
  <text x="688" y="204" font-size="10.5" fill="#6b747e">← from the 8086</text>

  <line x1="552" y1="264" x2="680" y2="264" stroke="#23303c" stroke-width="2" marker-end="url(#a49)"/>
  <text x="688" y="268" font-size="11.5" font-family="monospace" fill="#23303c">CAS0–CAS2</text>
  <text x="688" y="284" font-size="10.5" fill="#6b747e">→ slave 8259As</text>

  <!-- sequence -->
  <rect x="60" y="378" width="700" height="66" rx="4" fill="#f4f2ec" stroke="#cfd5da"/>
  <text x="410" y="398" text-anchor="middle" font-size="12.5" fill="#23303c">
    IRn asserts → IRR bit set → if unmasked and highest priority, INT goes high → first INTA: ISR set, IRR cleared
  </text>
  <text x="410" y="416" text-anchor="middle" font-size="12.5" fill="#23303c">
    → second INTA: the type number goes on D7–D0 → the handler runs → the handler writes EOI → ISR bit cleared
  </text>
  <text x="410" y="436" text-anchor="middle" font-size="12" fill="#b4562d">
    Forget the EOI and that interrupt fires exactly once, ever.
  </text>
</svg>
