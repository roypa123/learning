<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="Georgia, 'Times New Roman', serif">
  <rect width="820" height="400" fill="#fbfaf7"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" fill="#23303c">Wait states — stretching a cycle for slow memory</text>

  <g stroke="#dcd7cd" stroke-width="1">
    <line x1="120" y1="46" x2="120" y2="330"/>
    <line x1="230" y1="46" x2="230" y2="330"/>
    <line x1="340" y1="46" x2="340" y2="330"/>
    <line x1="450" y1="46" x2="450" y2="330"/>
    <line x1="560" y1="46" x2="560" y2="330"/>
    <line x1="670" y1="46" x2="670" y2="330"/>
    <line x1="780" y1="46" x2="780" y2="330"/>
  </g>
  <rect x="450" y="46" width="220" height="284" fill="#f2e7df" opacity="0.55"/>
  <g font-size="13" text-anchor="middle">
    <text x="175" y="62" fill="#b4562d">T1</text><text x="285" y="62" fill="#b4562d">T2</text>
    <text x="395" y="62" fill="#b4562d">T3</text>
    <text x="505" y="62" fill="#b4562d">Tw</text><text x="615" y="62" fill="#b4562d">Tw</text>
    <text x="725" y="62" fill="#b4562d">T4</text>
  </g>
  <text x="560" y="80" text-anchor="middle" font-size="11" fill="#b4562d">inserted because READY was low</text>

  <!-- CLK -->
  <text x="112" y="112" text-anchor="end" font-size="13" fill="#23303c">CLK</text>
  <polyline points="90,120 120,120 120,98 157,98 157,120 230,120 230,98 267,98 267,120 340,120 340,98 377,98 377,120 450,120 450,98 487,98 487,120 560,120 560,98 597,98 597,120 670,120 670,98 707,98 707,120 780,120 780,98 800,98"
            fill="none" stroke="#23303c" stroke-width="2"/>

  <!-- address -->
  <text x="112" y="166" text-anchor="end" font-size="12.5" fill="#23303c">latched A19–A0</text>
  <polyline points="90,156 108,156 122,148 770,148 780,156" fill="none" stroke="#23303c" stroke-width="1.8"/>
  <polyline points="90,166 108,166 122,174 770,174 780,166" fill="none" stroke="#23303c" stroke-width="1.8"/>
  <text x="440" y="166" text-anchor="middle" font-size="11.5" fill="#23303c">address stays stable for the whole stretched cycle</text>

  <!-- RD -->
  <text x="112" y="216" text-anchor="end" font-size="13" fill="#23303c">RD</text>
  <line x1="92" y1="202" x2="112" y2="202" stroke="#23303c" stroke-width="1.3"/>
  <polyline points="90,200 238,200 248,224 688,224 698,200 800,200" fill="none" stroke="#b4562d" stroke-width="2.2"/>
  <text x="468" y="242" text-anchor="middle" font-size="11" fill="#b4562d">RD stays asserted — the memory simply gets more time</text>

  <!-- READY -->
  <text x="112" y="286" text-anchor="end" font-size="13" fill="#23303c">READY</text>
  <polyline points="90,292 636,292 646,266 800,266" fill="none" stroke="#2f6f6b" stroke-width="2.2"/>
  <g stroke="#2f6f6b" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="410" y1="86" x2="410" y2="330"/>
    <line x1="520" y1="86" x2="520" y2="330"/>
    <line x1="630" y1="86" x2="630" y2="330"/>
  </g>
  <g font-size="10.5" fill="#2f6f6b" text-anchor="middle">
    <text x="410" y="316">low →</text><text x="410" y="328">insert Tw</text>
    <text x="520" y="316">low →</text><text x="520" y="328">insert Tw</text>
    <text x="630" y="316">high →</text><text x="630" y="328">go to T4</text>
  </g>

  <rect x="60" y="346" width="700" height="44" rx="4" fill="#f4f2ec" stroke="#cfd5da"/>
  <text x="410" y="366" text-anchor="middle" font-size="12.5" fill="#23303c">
    Each wait state adds one full clock period — 200 ns at 5 MHz — to the memory's budget: 460 ns becomes 660 ns, then 860 ns.
  </text>
  <text x="410" y="382" text-anchor="middle" font-size="12" fill="#6b747e">
    Drive the wait-state generator from the slow device's chip select, so fast devices are not slowed too.
  </text>
</svg>
