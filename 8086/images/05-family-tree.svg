<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family="Georgia, 'Times New Roman', serif">
  <rect width="820" height="340" fill="#fbfaf7"/>
  <text x="410" y="28" text-anchor="middle" font-size="17" fill="#23303c">The line the 8086 sits in</text>

  <defs>
    <marker id="fa" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#6b747e"/>
    </marker>
  </defs>

  <!-- timeline -->
  <line x1="50" y1="300" x2="780" y2="300" stroke="#9aa4ae" stroke-width="1.5"/>
  <g font-size="11.5" fill="#6b747e" text-anchor="middle">
    <text x="80" y="320">1971</text><text x="190" y="320">1974</text>
    <text x="300" y="320">1976</text><text x="420" y="320">1978</text>
    <text x="520" y="320">1979</text><text x="630" y="320">1982</text>
    <text x="745" y="320">1985</text>
  </g>

  <!-- boxes -->
  <g stroke="#23303c" stroke-width="1.6">
    <rect x="46" y="200" width="68" height="46" rx="4" fill="#eceae4"/>
    <rect x="156" y="200" width="68" height="46" rx="4" fill="#eceae4"/>
    <rect x="266" y="200" width="68" height="46" rx="4" fill="#eceae4"/>
    <rect x="376" y="120" width="88" height="60" rx="4" fill="#2b3440"/>
    <rect x="486" y="200" width="68" height="46" rx="4" fill="#eceae4"/>
    <rect x="590" y="120" width="80" height="46" rx="4" fill="#e4eaee"/>
    <rect x="590" y="186" width="80" height="46" rx="4" fill="#e4eaee"/>
    <rect x="706" y="152" width="80" height="46" rx="4" fill="#e4eaee"/>
  </g>

  <g text-anchor="middle" fill="#23303c">
    <text x="80" y="222" font-size="14">4004</text><text x="80" y="238" font-size="10.5" fill="#6b747e">4-bit</text>
    <text x="190" y="222" font-size="14">8080</text><text x="190" y="238" font-size="10.5" fill="#6b747e">8-bit, 64K</text>
    <text x="300" y="222" font-size="14">8085</text><text x="300" y="238" font-size="10.5" fill="#6b747e">+5 V only</text>
    <text x="520" y="222" font-size="14">8088</text><text x="520" y="238" font-size="10.5" fill="#6b747e">8-bit bus</text>
    <text x="630" y="140" font-size="14">80186</text><text x="630" y="156" font-size="10.5" fill="#6b747e">+peripherals</text>
    <text x="630" y="206" font-size="14">80286</text><text x="630" y="222" font-size="10.5" fill="#6b747e">protected mode</text>
    <text x="746" y="172" font-size="14">80386</text><text x="746" y="188" font-size="10.5" fill="#6b747e">32-bit, paging</text>
  </g>
  <text x="420" y="146" text-anchor="middle" font-size="18" fill="#f2efe8">8086</text>
  <text x="420" y="166" text-anchor="middle" font-size="11" fill="#b9c2cc">16-bit · 1 MiB</text>

  <!-- arrows -->
  <g stroke="#6b747e" stroke-width="1.6" fill="none" marker-end="url(#fa)">
    <line x1="114" y1="223" x2="152" y2="223"/>
    <line x1="224" y1="223" x2="262" y2="223"/>
    <path d="M334 216 C 356 210 360 180 372 160"/>
    <path d="M420 180 C 420 196 452 210 482 216"/>
    <path d="M464 142 C 510 136 550 136 586 140"/>
    <path d="M464 160 C 510 176 550 196 586 202"/>
    <path d="M670 200 C 690 196 692 182 702 176"/>
  </g>

  <!-- drop lines to timeline -->
  <g stroke="#cfd5da" stroke-width="1" stroke-dasharray="3 3">
    <line x1="80" y1="246" x2="80" y2="300"/>
    <line x1="190" y1="246" x2="190" y2="300"/>
    <line x1="300" y1="246" x2="300" y2="300"/>
    <line x1="420" y1="180" x2="420" y2="300"/>
    <line x1="520" y1="246" x2="520" y2="300"/>
    <line x1="630" y1="232" x2="630" y2="300"/>
    <line x1="746" y1="198" x2="746" y2="300"/>
  </g>

  <text x="410" y="70" text-anchor="middle" font-size="12.5" fill="#6b747e" font-style="italic">
    Every step kept the previous step's software working — which is why every step kept its mistakes.
  </text>
  <text x="410" y="90" text-anchor="middle" font-size="12.5" fill="#6b747e" font-style="italic">
    An x86-64 processor in 2026 still powers on in the 8086's real mode.
  </text>
</svg>
