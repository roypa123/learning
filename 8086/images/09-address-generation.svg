<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" font-family="Georgia, 'Times New Roman', serif">
  <rect width="840" height="520" fill="#fbfaf7"/>
  <text x="420" y="30" text-anchor="middle" font-size="18" fill="#23303c">How the 8086 makes a 20-bit address out of two 16-bit numbers</text>

  <defs>
    <marker id="a9" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#23303c"/>
    </marker>
  </defs>

  <!-- segment register -->
  <text x="60" y="84" font-size="13" fill="#23303c">segment register</text>
  <text x="60" y="102" font-size="11.5" fill="#6b747e">(CS, DS, SS or ES)</text>
  <g stroke="#23303c" stroke-width="1.5" font-family="monospace" font-size="16">
    <rect x="230" y="70" width="46" height="34" fill="#f2e7df"/>
    <rect x="276" y="70" width="46" height="34" fill="#f2e7df"/>
    <rect x="322" y="70" width="46" height="34" fill="#f2e7df"/>
    <rect x="368" y="70" width="46" height="34" fill="#f2e7df"/>
    <text x="253" y="94" text-anchor="middle" fill="#23303c" stroke="none">1</text>
    <text x="299" y="94" text-anchor="middle" fill="#23303c" stroke="none">A</text>
    <text x="345" y="94" text-anchor="middle" fill="#23303c" stroke="none">2</text>
    <text x="391" y="94" text-anchor="middle" fill="#23303c" stroke="none">B</text>
  </g>
  <text x="430" y="92" font-size="12" fill="#6b747e">16 bits</text>

  <!-- shift -->
  <line x1="322" y1="112" x2="322" y2="146" stroke="#23303c" stroke-width="1.6" marker-end="url(#a9)"/>
  <text x="334" y="136" font-size="12.5" fill="#b4562d">shift left 4 bits — i.e. append one hex zero</text>

  <g stroke="#23303c" stroke-width="1.5" font-family="monospace" font-size="16">
    <rect x="184" y="154" width="46" height="34" fill="#dfe6ea"/>
    <rect x="230" y="154" width="46" height="34" fill="#dfe6ea"/>
    <rect x="276" y="154" width="46" height="34" fill="#dfe6ea"/>
    <rect x="322" y="154" width="46" height="34" fill="#dfe6ea"/>
    <rect x="368" y="154" width="46" height="34" fill="#f4e3d6"/>
    <text x="207" y="178" text-anchor="middle" fill="#23303c" stroke="none">1</text>
    <text x="253" y="178" text-anchor="middle" fill="#23303c" stroke="none">A</text>
    <text x="299" y="178" text-anchor="middle" fill="#23303c" stroke="none">2</text>
    <text x="345" y="178" text-anchor="middle" fill="#23303c" stroke="none">B</text>
    <text x="391" y="178" text-anchor="middle" fill="#b4562d" stroke="none">0</text>
  </g>
  <text x="430" y="176" font-size="12" fill="#6b747e">20 bits — this is the segment BASE</text>

  <!-- offset -->
  <text x="60" y="242" font-size="13" fill="#23303c">offset</text>
  <text x="60" y="260" font-size="11.5" fill="#6b747e">(IP, SP, or an effective address)</text>
  <g stroke="#23303c" stroke-width="1.5" font-family="monospace" font-size="16">
    <rect x="230" y="228" width="46" height="34" fill="#e4eaee"/>
    <rect x="276" y="228" width="46" height="34" fill="#e4eaee"/>
    <rect x="322" y="228" width="46" height="34" fill="#e4eaee"/>
    <rect x="368" y="228" width="46" height="34" fill="#e4eaee"/>
    <text x="253" y="252" text-anchor="middle" fill="#23303c" stroke="none">3</text>
    <text x="299" y="252" text-anchor="middle" fill="#23303c" stroke="none">C</text>
    <text x="345" y="252" text-anchor="middle" fill="#23303c" stroke="none">4</text>
    <text x="391" y="252" text-anchor="middle" fill="#23303c" stroke="none">D</text>
  </g>
  <text x="430" y="250" font-size="12" fill="#6b747e">16 bits</text>

  <!-- adder -->
  <text x="160" y="182" font-size="20" fill="#23303c">+</text>
  <line x1="170" y1="284" x2="440" y2="284" stroke="#23303c" stroke-width="1.6"/>
  <text x="470" y="290" font-size="12.5" fill="#b4562d">20-bit adder inside the BIU — runs on every memory reference</text>

  <!-- result -->
  <g stroke="#23303c" stroke-width="1.8" font-family="monospace" font-size="16">
    <rect x="184" y="298" width="46" height="34" fill="#2b3440"/>
    <rect x="230" y="298" width="46" height="34" fill="#2b3440"/>
    <rect x="276" y="298" width="46" height="34" fill="#2b3440"/>
    <rect x="322" y="298" width="46" height="34" fill="#2b3440"/>
    <rect x="368" y="298" width="46" height="34" fill="#2b3440"/>
    <text x="207" y="322" text-anchor="middle" fill="#f2efe8" stroke="none">1</text>
    <text x="253" y="322" text-anchor="middle" fill="#f2efe8" stroke="none">D</text>
    <text x="299" y="322" text-anchor="middle" fill="#f2efe8" stroke="none">E</text>
    <text x="345" y="322" text-anchor="middle" fill="#f2efe8" stroke="none">7</text>
    <text x="391" y="322" text-anchor="middle" fill="#f2efe8" stroke="none">D</text>
  </g>
  <text x="430" y="320" font-size="12.5" fill="#23303c">physical address, driven onto A19–A0</text>

  <text x="60" y="322" font-size="13" fill="#23303c">physical address</text>

  <!-- worked line -->
  <rect x="60" y="360" width="720" height="78" rx="4" fill="#f4f2ec" stroke="#cfd5da"/>
  <text x="80" y="386" font-size="13.5" font-family="monospace" fill="#23303c">  1A2B : 3C4D</text>
  <text x="80" y="408" font-size="13.5" font-family="monospace" fill="#23303c">  1A2B0  +  3C4D   =   1DE7D</text>
  <text x="80" y="428" font-size="12" fill="#6b747e" font-style="italic">Appending the zero is the ×16. No base conversion is ever needed — this is why addresses are written in hex.</text>

  <!-- overlap note -->
  <text x="420" y="468" text-anchor="middle" font-size="12.5" fill="#6b747e">
    Consecutive segment values are 16 bytes apart, so segments overlap:
  </text>
  <text x="420" y="488" text-anchor="middle" font-size="12.5" fill="#6b747e">
    every physical address can be written as 4096 different segment:offset pairs.
  </text>
</svg>
