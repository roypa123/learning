<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" width="820" height="480" font-family="Georgia, 'Times New Roman', serif">
  <rect width="820" height="480" fill="#fbfaf7"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" fill="#23303c">8251A — mode, command and status words</text>

  <!-- MODE -->
  <text x="60" y="66" font-size="14" fill="#b4562d">MODE word (asynchronous) — written first, after reset</text>
  <g font-size="11" fill="#6b747e" font-family="monospace" text-anchor="middle">
    <text x="130" y="86">7</text><text x="210" y="86">6</text>
    <text x="300" y="86">5</text><text x="380" y="86">4</text>
    <text x="470" y="86">3</text><text x="550" y="86">2</text>
    <text x="640" y="86">1</text><text x="716" y="86">0</text>
  </g>
  <g stroke="#23303c" stroke-width="1.5">
    <rect x="90" y="92" width="160" height="44" fill="#f2e7df"/>
    <rect x="250" y="92" width="170" height="44" fill="#dfe6ea"/>
    <rect x="420" y="92" width="170" height="44" fill="#e4eaee"/>
    <rect x="590" y="92" width="166" height="44" fill="#f4e3d6"/>
  </g>
  <g font-size="12.5" text-anchor="middle" fill="#23303c">
    <text x="170" y="112">stop bits</text>
    <text x="335" y="112">EP  PEN</text>
    <text x="505" y="112">char length</text>
    <text x="673" y="112">baud factor</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#6b747e">
    <text x="170" y="128">01 = 1, 11 = 2</text>
    <text x="335" y="128">x0 none, 01 odd, 11 even</text>
    <text x="505" y="128">11 = 8 bits</text>
    <text x="673" y="128">10 = ×16</text>
  </g>
  <rect x="90" y="146" width="666" height="26" rx="3" fill="#f4e3d6" stroke="#dcc3b4"/>
  <text x="423" y="164" text-anchor="middle" font-size="12.5" fill="#b4562d">
    0x4E = 01 00 11 10 — one stop bit, no parity, 8 data bits, ×16. This is "8-N-1".
  </text>

  <!-- COMMAND -->
  <text x="60" y="204" font-size="14" fill="#b4562d">COMMAND word — written after the mode word, and whenever you want</text>
  <g font-size="11" fill="#6b747e" font-family="monospace" text-anchor="middle">
    <text x="132" y="224">7</text><text x="216" y="224">6</text><text x="300" y="224">5</text>
    <text x="384" y="224">4</text><text x="468" y="224">3</text><text x="552" y="224">2</text>
    <text x="636" y="224">1</text><text x="716" y="224">0</text>
  </g>
  <g stroke="#23303c" stroke-width="1.5">
    <rect x="90" y="230" width="84" height="40" fill="#eceae4"/>
    <rect x="174" y="230" width="84" height="40" fill="#f2e7df"/>
    <rect x="258" y="230" width="84" height="40" fill="#e4eaee"/>
    <rect x="342" y="230" width="84" height="40" fill="#f2e7df"/>
    <rect x="426" y="230" width="84" height="40" fill="#eceae4"/>
    <rect x="510" y="230" width="84" height="40" fill="#e4eaee"/>
    <rect x="594" y="230" width="84" height="40" fill="#e4eaee"/>
    <rect x="678" y="230" width="78" height="40" fill="#e4eaee"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#23303c">
    <text x="132" y="248">EH</text><text x="216" y="248">IR</text><text x="300" y="248">RTS</text>
    <text x="384" y="248">ER</text><text x="468" y="248">SBRK</text><text x="552" y="248">RxE</text>
    <text x="636" y="248">DTR</text><text x="717" y="248">TxEN</text>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#6b747e">
    <text x="132" y="264">hunt</text><text x="216" y="264">reset</text><text x="300" y="264">rts out</text>
    <text x="384" y="264">clr errs</text><text x="468" y="264">break</text><text x="552" y="264">rx on</text>
    <text x="636" y="264">dtr out</text><text x="717" y="264">tx on</text>
  </g>
  <rect x="90" y="280" width="666" height="26" rx="3" fill="#f4e3d6" stroke="#dcc3b4"/>
  <text x="423" y="298" text-anchor="middle" font-size="12.5" fill="#b4562d">
    0x37 = everything on, errors cleared. 0x40 (IR alone) = internal reset, back to expecting a mode word.
  </text>

  <!-- STATUS -->
  <text x="60" y="338" font-size="14" fill="#2f6f6b">STATUS — read from the control address</text>
  <g font-size="11" fill="#6b747e" font-family="monospace" text-anchor="middle">
    <text x="132" y="358">7</text><text x="216" y="358">6</text><text x="300" y="358">5</text>
    <text x="384" y="358">4</text><text x="468" y="358">3</text><text x="552" y="358">2</text>
    <text x="636" y="358">1</text><text x="716" y="358">0</text>
  </g>
  <g stroke="#23303c" stroke-width="1.5">
    <rect x="90" y="364" width="84" height="40" fill="#eceae4"/>
    <rect x="174" y="364" width="84" height="40" fill="#eceae4"/>
    <rect x="258" y="364" width="84" height="40" fill="#f2e7df"/>
    <rect x="342" y="364" width="84" height="40" fill="#f2e7df"/>
    <rect x="426" y="364" width="84" height="40" fill="#f2e7df"/>
    <rect x="510" y="364" width="84" height="40" fill="#eceae4"/>
    <rect x="594" y="364" width="84" height="40" fill="#dfe6ea"/>
    <rect x="678" y="364" width="78" height="40" fill="#dfe6ea"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#23303c">
    <text x="132" y="382">DSR</text><text x="216" y="382">SBD</text><text x="300" y="382">FE</text>
    <text x="384" y="382">OE</text><text x="468" y="382">PE</text><text x="552" y="382">TxE</text>
    <text x="636" y="382">RxRDY</text><text x="717" y="382">TxRDY</text>
  </g>
  <g font-size="9.5" text-anchor="middle" fill="#6b747e">
    <text x="300" y="398">framing</text><text x="384" y="398">overrun</text><text x="468" y="398">parity</text>
    <text x="636" y="398">may read</text><text x="717" y="398">may write</text>
  </g>

  <rect x="60" y="418" width="700" height="50" rx="4" fill="#f4f2ec" stroke="#cfd5da"/>
  <text x="410" y="438" text-anchor="middle" font-size="12.5" fill="#23303c">
    OVERRUN means your software was too slow. FRAMING means the two ends disagree about the baud rate.
  </text>
  <text x="410" y="458" text-anchor="middle" font-size="12" fill="#6b747e">
    All three error bits are sticky until a command word with ER set clears them.
  </text>
</svg>
