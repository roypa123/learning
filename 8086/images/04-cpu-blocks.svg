<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Georgia, 'Times New Roman', serif">
  <rect width="800" height="430" fill="#fbfaf7"/>
  <text x="400" y="28" text-anchor="middle" font-size="17" fill="#23303c">The parts of any processor, and the three buses</text>

  <!-- CPU boundary -->
  <rect x="40" y="52" width="440" height="330" rx="8" fill="none" stroke="#23303c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="56" y="74" font-size="13" fill="#6b747e" font-style="italic">the processor chip</text>

  <!-- registers -->
  <rect x="70" y="96" width="150" height="104" rx="4" fill="#e4eaee" stroke="#23303c" stroke-width="1.6"/>
  <text x="145" y="118" text-anchor="middle" font-size="14" fill="#23303c">Registers</text>
  <line x1="82" y1="128" x2="208" y2="128" stroke="#9aa4ae"/>
  <text x="145" y="148" text-anchor="middle" font-size="12" fill="#3a4653">AX BX CX DX</text>
  <text x="145" y="166" text-anchor="middle" font-size="12" fill="#3a4653">SI DI BP SP</text>
  <text x="145" y="188" text-anchor="middle" font-size="12" fill="#b4562d">IP — next instruction</text>

  <!-- ALU -->
  <path d="M270 96 h120 l-24 44 l24 44 h-120 l24 -44 z" fill="#e4eaee" stroke="#23303c" stroke-width="1.6"/>
  <text x="330" y="132" text-anchor="middle" font-size="14" fill="#23303c">ALU</text>
  <text x="330" y="152" text-anchor="middle" font-size="11.5" fill="#3a4653">add · sub · and · or · shift</text>

  <!-- flags -->
  <rect x="270" y="202" width="120" height="34" rx="4" fill="#f2e7df" stroke="#23303c" stroke-width="1.6"/>
  <text x="330" y="224" text-anchor="middle" font-size="13" fill="#23303c">FLAGS</text>
  <line x1="330" y1="184" x2="330" y2="202" stroke="#23303c" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- control unit -->
  <rect x="70" y="248" width="150" height="90" rx="4" fill="#e4eaee" stroke="#23303c" stroke-width="1.6"/>
  <text x="145" y="272" text-anchor="middle" font-size="14" fill="#23303c">Control unit</text>
  <line x1="82" y1="282" x2="208" y2="282" stroke="#9aa4ae"/>
  <text x="145" y="302" text-anchor="middle" font-size="11.5" fill="#3a4653">decodes the opcode,</text>
  <text x="145" y="320" text-anchor="middle" font-size="11.5" fill="#3a4653">sequences everything else</text>

  <!-- bus interface -->
  <rect x="270" y="262" width="150" height="76" rx="4" fill="#e4eaee" stroke="#23303c" stroke-width="1.6"/>
  <text x="345" y="286" text-anchor="middle" font-size="14" fill="#23303c">Bus interface</text>
  <text x="345" y="308" text-anchor="middle" font-size="11.5" fill="#3a4653">drives addresses,</text>
  <text x="345" y="325" text-anchor="middle" font-size="11.5" fill="#3a4653">reads/writes data</text>

  <!-- internal bus -->
  <line x1="145" y1="200" x2="145" y2="248" stroke="#23303c" stroke-width="1.6"/>
  <line x1="220" y1="148" x2="266" y2="148" stroke="#23303c" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="266" y1="168" x2="220" y2="168" stroke="#23303c" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="220" y1="292" x2="266" y2="292" stroke="#23303c" stroke-width="1.6" marker-end="url(#a)"/>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#23303c"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#2f6f6b"/>
    </marker>
  </defs>

  <!-- memory -->
  <rect x="620" y="96" width="140" height="240" rx="4" fill="#eceae4" stroke="#23303c" stroke-width="1.6"/>
  <text x="690" y="122" text-anchor="middle" font-size="14" fill="#23303c">Memory</text>
  <line x1="632" y1="132" x2="748" y2="132" stroke="#9aa4ae"/>
  <g font-size="11.5" fill="#3a4653" font-family="monospace">
    <text x="640" y="154">00000  B4</text>
    <text x="640" y="174">00001  09</text>
    <text x="640" y="194">00002  BA</text>
    <text x="640" y="214">00003  0D</text>
    <text x="640" y="234">  ...</text>
    <text x="640" y="258">instructions</text>
    <text x="640" y="278">and data,</text>
    <text x="640" y="298">indistinguishable</text>
  </g>

  <!-- buses -->
  <g stroke="#2f6f6b" stroke-width="3">
    <line x1="480" y1="140" x2="616" y2="140" marker-end="url(#ab)"/>
    <line x1="480" y1="196" x2="616" y2="196"/>
    <line x1="480" y1="252" x2="616" y2="252" marker-end="url(#ab)"/>
  </g>
  <line x1="616" y1="196" x2="480" y2="196" stroke="#2f6f6b" stroke-width="3" marker-end="url(#ab)"/>
  <line x1="480" y1="196" x2="616" y2="196" stroke="#2f6f6b" stroke-width="3" marker-end="url(#ab)"/>

  <g font-size="12.5" fill="#2f6f6b">
    <text x="548" y="132" text-anchor="middle">address bus — 20 lines</text>
    <text x="548" y="188" text-anchor="middle">data bus — 16 lines</text>
    <text x="548" y="244" text-anchor="middle">control bus — RD, WR, M/IO…</text>
  </g>
  <g font-size="11" fill="#6b747e" font-style="italic">
    <text x="548" y="158" text-anchor="middle">which location — one way only</text>
    <text x="548" y="214" text-anchor="middle">the value — both ways</text>
    <text x="548" y="270" text-anchor="middle">what kind of access, and when</text>
  </g>

  <text x="400" y="406" text-anchor="middle" font-size="12" fill="#6b747e" font-style="italic">
    2²⁰ addresses = 1 MiB. 16 data lines = one word per bus cycle. Both limits come straight from the pin count.
  </text>
</svg>
