<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="Georgia, 'Times New Roman', serif">
  <rect width="820" height="520" fill="#fbfaf7"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" fill="#23303c">The 8255A control word</text>

  <!-- mode set -->
  <text x="60" y="66" font-size="14" fill="#b4562d">Bit 7 = 1 — MODE SET</text>

  <g font-size="11" fill="#6b747e" font-family="monospace" text-anchor="middle">
    <text x="118" y="88">7</text><text x="204" y="88">6</text><text x="268" y="88">5</text>
    <text x="340" y="88">4</text><text x="424" y="88">3</text><text x="504" y="88">2</text>
    <text x="576" y="88">1</text><text x="660" y="88">0</text>
  </g>

  <g stroke="#23303c" stroke-width="1.5">
    <rect x="84" y="94" width="68" height="44" fill="#f4e3d6"/>
    <rect x="152" y="94" width="152" height="44" fill="#dfe6ea"/>
    <rect x="304" y="94" width="72" height="44" fill="#e4eaee"/>
    <rect x="376" y="94" width="96" height="44" fill="#e4eaee"/>
    <rect x="472" y="94" width="64" height="44" fill="#dfe6ea"/>
    <rect x="536" y="94" width="80" height="44" fill="#e4eaee"/>
    <rect x="616" y="94" width="88" height="44" fill="#e4eaee"/>
  </g>

  <g font-size="12" text-anchor="middle" fill="#23303c">
    <text x="118" y="115">1</text>
    <text x="228" y="115">Port A mode</text>
    <text x="340" y="115">A dir</text>
    <text x="424" y="115">C upper</text>
    <text x="504" y="115">B mode</text>
    <text x="576" y="115">B dir</text>
    <text x="660" y="115">C lower</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#6b747e">
    <text x="118" y="131">mode set</text>
    <text x="228" y="131">00/01/1x</text>
    <text x="340" y="131">1 = in</text>
    <text x="424" y="131">1 = in</text>
    <text x="504" y="131">0 or 1</text>
    <text x="576" y="131">1 = in</text>
    <text x="660" y="131">1 = in</text>
  </g>

  <line x1="152" y1="150" x2="472" y2="150" stroke="#2f6f6b" stroke-width="1.6"/>
  <text x="312" y="166" text-anchor="middle" font-size="12" fill="#2f6f6b">Group A — Port A and Port C upper</text>
  <line x1="472" y1="150" x2="704" y2="150" stroke="#b4562d" stroke-width="1.6"/>
  <text x="588" y="166" text-anchor="middle" font-size="12" fill="#b4562d">Group B — Port B and Port C lower</text>

  <rect x="84" y="182" width="620" height="30" rx="3" fill="#f4e3d6" stroke="#dcc3b4"/>
  <text x="394" y="202" text-anchor="middle" font-size="13.5" fill="#b4562d">1 means INPUT, 0 means OUTPUT — always</text>

  <!-- worked examples -->
  <text x="60" y="248" font-size="14" fill="#23303c">Worked examples</text>
  <g font-size="12.5" font-family="monospace" fill="#23303c">
    <text x="84" y="272">1 00 0 0 0 0 0  = 0x80   all three ports output</text>
    <text x="84" y="292">1 00 0 0 0 1 0  = 0x82   Port B input, the rest output</text>
    <text x="84" y="312">1 00 1 1 0 0 0  = 0x98   Port A and Port C upper input</text>
    <text x="84" y="332">1 00 1 1 0 1 1  = 0x9B   everything input</text>
    <text x="84" y="352">1 01 0 0 0 0 0  = 0xA0   Port A mode 1 output</text>
  </g>

  <!-- bit set/reset -->
  <text x="60" y="394" font-size="14" fill="#b4562d">Bit 7 = 0 — BIT SET / RESET (Port C only)</text>

  <g stroke="#23303c" stroke-width="1.5">
    <rect x="84" y="406" width="68" height="40" fill="#f4e3d6"/>
    <rect x="152" y="406" width="180" height="40" fill="#eceae4"/>
    <rect x="332" y="406" width="150" height="40" fill="#dfe6ea"/>
    <rect x="482" y="406" width="90" height="40" fill="#e4eaee"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#23303c">
    <text x="118" y="425">0</text>
    <text x="242" y="425">unused</text>
    <text x="407" y="425">bit select 0–7</text>
    <text x="527" y="425">set / reset</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#6b747e">
    <text x="118" y="440">not mode set</text>
    <text x="242" y="440">bits 6–4</text>
    <text x="407" y="440">bits 3–1</text>
    <text x="527" y="440">bit 0: 1 = set</text>
  </g>

  <rect x="60" y="462" width="700" height="46" rx="4" fill="#f4f2ec" stroke="#cfd5da"/>
  <text x="410" y="482" text-anchor="middle" font-size="12.5" fill="#23303c">
    Bit set/reset is the only correct way to change a single Port C output bit — it is atomic and needs no read.
  </text>
  <text x="410" y="500" text-anchor="middle" font-size="12" fill="#6b747e">
    It is also how mode 1 and 2 interrupts are enabled, through PC4 (A in), PC6 (A out) and PC2 (B).
  </text>
</svg>
