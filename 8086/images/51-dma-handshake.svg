<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="Georgia, 'Times New Roman', serif">
  <rect width="820" height="470" fill="#fbfaf7"/>
  <text x="410" y="30" text-anchor="middle" font-size="18" fill="#23303c">The DMA handshake — how the 8237 borrows the bus</text>

  <defs>
    <marker id="a51" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#b4562d"/>
    </marker>
  </defs>

  <!-- blocks -->
  <rect x="60" y="70" width="140" height="80" rx="4" fill="#eceae4" stroke="#23303c" stroke-width="1.6"/>
  <text x="130" y="98" text-anchor="middle" font-size="14" fill="#23303c">device</text>
  <text x="130" y="118" text-anchor="middle" font-size="11" fill="#6b747e">floppy controller,</text>
  <text x="130" y="134" text-anchor="middle" font-size="11" fill="#6b747e">sound card, …</text>

  <rect x="330" y="70" width="160" height="80" rx="4" fill="#e4eaee" stroke="#23303c" stroke-width="1.8"/>
  <text x="410" y="98" text-anchor="middle" font-size="15" fill="#23303c">8237A</text>
  <text x="410" y="118" text-anchor="middle" font-size="11" fill="#6b747e">address counter</text>
  <text x="410" y="134" text-anchor="middle" font-size="11" fill="#6b747e">byte counter</text>

  <rect x="620" y="70" width="140" height="80" rx="4" fill="#2b3440" stroke="#151c24" stroke-width="1.8"/>
  <text x="690" y="100" text-anchor="middle" font-size="15" fill="#f2efe8">8086</text>
  <text x="690" y="122" text-anchor="middle" font-size="11" fill="#b9c2cc">stopped while</text>
  <text x="690" y="138" text-anchor="middle" font-size="11" fill="#b9c2cc">HLDA is asserted</text>

  <rect x="330" y="290" width="160" height="70" rx="4" fill="#dfe6ea" stroke="#23303c" stroke-width="1.6"/>
  <text x="410" y="318" text-anchor="middle" font-size="14" fill="#23303c">memory</text>
  <text x="410" y="340" text-anchor="middle" font-size="11" fill="#6b747e">the DMA destination</text>

  <!-- arrows -->
  <line x1="202" y1="92" x2="328" y2="92" stroke="#b4562d" stroke-width="2" marker-end="url(#a51)"/>
  <text x="265" y="86" text-anchor="middle" font-size="11" font-family="monospace" fill="#b4562d">1 DREQ</text>

  <line x1="492" y1="92" x2="618" y2="92" stroke="#b4562d" stroke-width="2" marker-end="url(#a51)"/>
  <text x="555" y="86" text-anchor="middle" font-size="11" font-family="monospace" fill="#b4562d">2 HRQ → HOLD</text>

  <line x1="618" y1="128" x2="492" y2="128" stroke="#2f6f6b" stroke-width="2" marker-end="url(#a51)"/>
  <text x="555" y="146" text-anchor="middle" font-size="11" font-family="monospace" fill="#2f6f6b">3 HLDA — bus floated</text>

  <line x1="328" y1="128" x2="202" y2="128" stroke="#2f6f6b" stroke-width="2" marker-end="url(#a51)"/>
  <text x="265" y="146" text-anchor="middle" font-size="11" font-family="monospace" fill="#2f6f6b">4 DACK</text>

  <!-- transfer path -->
  <path d="M130 152 V 250 H 690 V 152" fill="none" stroke="#23303c" stroke-width="3"/>
  <text x="410" y="244" text-anchor="middle" font-size="12" fill="#6b747e">the shared data bus</text>
  <line x1="410" y1="250" x2="410" y2="288" stroke="#b4562d" stroke-width="3" marker-end="url(#a51)"/>

  <path d="M170 160 C 200 210 300 240 330 300" fill="none" stroke="#b4562d" stroke-width="3" marker-end="url(#a51)" stroke-dasharray="6 3"/>
  <text x="220" y="280" font-size="12" fill="#b4562d">5 one bus cycle:</text>
  <text x="220" y="296" font-size="12" fill="#b4562d">IOR# and MEMW#</text>
  <text x="220" y="312" font-size="12" fill="#b4562d">asserted together</text>

  <!-- comparison -->
  <rect x="60" y="382" width="700" height="76" rx="4" fill="#f4f2ec" stroke="#cfd5da"/>
  <text x="410" y="404" text-anchor="middle" font-size="13" fill="#23303c">
    Ordinary I/O: device → CPU register → memory. Two bus cycles, plus the instruction fetches.
  </text>
  <text x="410" y="426" text-anchor="middle" font-size="13" fill="#b4562d">
    DMA: device → memory. ONE bus cycle. The byte crosses the bus once and is never held anywhere.
  </text>
  <text x="410" y="448" text-anchor="middle" font-size="12" fill="#6b747e">
    512 bytes: about 18,400 clocks with the CPU, against 512 bus cycles with DMA.
  </text>
</svg>
