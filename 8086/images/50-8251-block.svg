<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Georgia, 'Times New Roman', serif">
  <rect width="800" height="400" fill="#fbfaf7"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" fill="#23303c">8251A USART — parallel in, serial out</text>

  <defs>
    <marker id="a50" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#23303c"/>
    </marker>
    <marker id="a50g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#2f6f6b"/>
    </marker>
  </defs>

  <rect x="250" y="62" width="300" height="250" rx="5" fill="#eceae4" stroke="#23303c" stroke-width="2"/>
  <text x="400" y="88" text-anchor="middle" font-size="16" fill="#23303c">8251A</text>
  <line x1="250" y1="98" x2="550" y2="98" stroke="#9aa4ae"/>

  <rect x="268" y="110" width="126" height="46" rx="3" fill="#dfe6ea" stroke="#8a939d"/>
  <text x="331" y="130" text-anchor="middle" font-size="11.5" fill="#23303c">data bus buffer</text>
  <text x="331" y="146" text-anchor="middle" font-size="10" fill="#6b747e">D7–D0</text>

  <rect x="268" y="166" width="126" height="60" rx="3" fill="#f2e7df" stroke="#8a939d"/>
  <text x="331" y="186" text-anchor="middle" font-size="11.5" fill="#23303c">mode / command</text>
  <text x="331" y="202" text-anchor="middle" font-size="11.5" fill="#23303c">and status</text>
  <text x="331" y="218" text-anchor="middle" font-size="10" fill="#b4562d">C/D# = 1</text>

  <rect x="268" y="236" width="126" height="56" rx="3" fill="#dfe6ea" stroke="#8a939d"/>
  <text x="331" y="258" text-anchor="middle" font-size="11.5" fill="#23303c">read / write logic</text>
  <text x="331" y="276" text-anchor="middle" font-size="10" fill="#6b747e">CS RD WR C/D RESET</text>

  <rect x="410" y="110" width="126" height="86" rx="3" fill="#e4eaee" stroke="#23303c" stroke-width="1.4"/>
  <text x="473" y="132" text-anchor="middle" font-size="12.5" fill="#23303c">transmitter</text>
  <text x="473" y="150" text-anchor="middle" font-size="10.5" fill="#6b747e">buffer + shift register</text>
  <text x="473" y="168" text-anchor="middle" font-size="10.5" fill="#6b747e">adds start, parity, stop</text>
  <text x="473" y="188" text-anchor="middle" font-size="10.5" fill="#b4562d">TxRDY when free</text>

  <rect x="410" y="206" width="126" height="86" rx="3" fill="#e4eaee" stroke="#23303c" stroke-width="1.4"/>
  <text x="473" y="228" text-anchor="middle" font-size="12.5" fill="#23303c">receiver</text>
  <text x="473" y="246" text-anchor="middle" font-size="10.5" fill="#6b747e">samples, strips framing</text>
  <text x="473" y="264" text-anchor="middle" font-size="10.5" fill="#6b747e">checks parity</text>
  <text x="473" y="284" text-anchor="middle" font-size="10.5" fill="#b4562d">RxRDY when full</text>

  <!-- left -->
  <g stroke="#23303c" stroke-width="1.8" marker-end="url(#a50)">
    <line x1="150" y1="132" x2="246" y2="132"/>
    <line x1="150" y1="264" x2="246" y2="264"/>
  </g>
  <g font-size="11.5" font-family="monospace" fill="#23303c" text-anchor="end">
    <text x="144" y="136">D7–D0</text>
    <text x="144" y="268">CS RD WR C/D</text>
  </g>

  <!-- right -->
  <line x1="538" y1="140" x2="660" y2="140" stroke="#2f6f6b" stroke-width="2.4" marker-end="url(#a50g)"/>
  <text x="668" y="144" font-size="12" font-family="monospace" fill="#2f6f6b">TxD</text>
  <line x1="660" y1="248" x2="538" y2="248" stroke="#2f6f6b" stroke-width="2.4" marker-end="url(#a50g)"/>
  <text x="668" y="252" font-size="12" font-family="monospace" fill="#2f6f6b">RxD</text>

  <line x1="660" y1="172" x2="538" y2="172" stroke="#b4562d" stroke-width="1.8" marker-end="url(#a50)"/>
  <text x="668" y="176" font-size="11.5" font-family="monospace" fill="#b4562d">TxC</text>
  <line x1="660" y1="220" x2="538" y2="220" stroke="#b4562d" stroke-width="1.8" marker-end="url(#a50)"/>
  <text x="668" y="224" font-size="11.5" font-family="monospace" fill="#b4562d">RxC</text>
  <text x="668" y="196" font-size="10.5" fill="#6b747e">supplied EXTERNALLY —</text>
  <text x="668" y="210" font-size="10.5" fill="#6b747e">baud × 16</text>

  <rect x="60" y="328" width="680" height="56" rx="4" fill="#f4f2ec" stroke="#cfd5da"/>
  <text x="400" y="348" text-anchor="middle" font-size="12.5" fill="#23303c">
    Initialisation order after reset: three dummy writes → command 0x40 (internal reset) → MODE word → COMMAND word
  </text>
  <text x="400" y="370" text-anchor="middle" font-size="12.5" fill="#b4562d">
    0x4E = 8-N-1 at ×16 · 0x37 = RTS + error reset + RxE + DTR + TxEN
  </text>
</svg>
