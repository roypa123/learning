<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Georgia, 'Times New Roman', serif">
  <rect width="760" height="360" fill="#fbfaf7"/>
  <text x="380" y="34" text-anchor="middle" font-size="19" fill="#23303c">The Intel 8086 at a glance</text>

  <!-- chip body -->
  <rect x="270" y="72" width="220" height="230" rx="6" fill="#2b3440" stroke="#151c24" stroke-width="2"/>
  <!-- notch -->
  <path d="M355 72 a25 25 0 0 0 50 0" fill="#fbfaf7" stroke="#151c24" stroke-width="2"/>
  <text x="380" y="176" text-anchor="middle" font-size="26" fill="#f2efe8" letter-spacing="2">i8086</text>
  <text x="380" y="202" text-anchor="middle" font-size="12" fill="#b9c2cc">40-pin DIP</text>
  <text x="380" y="222" text-anchor="middle" font-size="12" fill="#b9c2cc">HMOS · 29,000 transistors</text>

  <!-- pins left -->
  <g fill="#8a939d">
    <rect x="252" y="92" width="18" height="7"/><rect x="252" y="112" width="18" height="7"/>
    <rect x="252" y="132" width="18" height="7"/><rect x="252" y="152" width="18" height="7"/>
    <rect x="252" y="172" width="18" height="7"/><rect x="252" y="192" width="18" height="7"/>
    <rect x="252" y="212" width="18" height="7"/><rect x="252" y="232" width="18" height="7"/>
    <rect x="252" y="252" width="18" height="7"/><rect x="252" y="272" width="18" height="7"/>
    <rect x="490" y="92" width="18" height="7"/><rect x="490" y="112" width="18" height="7"/>
    <rect x="490" y="132" width="18" height="7"/><rect x="490" y="152" width="18" height="7"/>
    <rect x="490" y="172" width="18" height="7"/><rect x="490" y="192" width="18" height="7"/>
    <rect x="490" y="212" width="18" height="7"/><rect x="490" y="232" width="18" height="7"/>
    <rect x="490" y="252" width="18" height="7"/><rect x="490" y="272" width="18" height="7"/>
  </g>

  <!-- left annotations -->
  <g font-size="13" fill="#23303c">
    <text x="232" y="100" text-anchor="end">16-bit registers</text>
    <text x="232" y="132" text-anchor="end">20-bit address bus</text>
    <text x="232" y="164" text-anchor="end">16-bit data bus</text>
    <text x="232" y="196" text-anchor="end">multiplexed AD15–AD0</text>
    <text x="232" y="228" text-anchor="end">5 – 10 MHz clock</text>
    <text x="232" y="260" text-anchor="end">min / max mode</text>
  </g>
  <g stroke="#9aa4ae" stroke-width="1" stroke-dasharray="3 3">
    <line x1="238" y1="96" x2="252" y2="96"/>
    <line x1="238" y1="128" x2="252" y2="128"/>
    <line x1="238" y1="160" x2="252" y2="160"/>
    <line x1="238" y1="192" x2="252" y2="192"/>
    <line x1="238" y1="224" x2="252" y2="224"/>
    <line x1="238" y1="256" x2="252" y2="256"/>
  </g>

  <!-- right annotations -->
  <g font-size="13" fill="#23303c">
    <text x="528" y="100">1 MiB address space</text>
    <text x="528" y="132">64 KiB I/O port space</text>
    <text x="528" y="164">4 segment registers</text>
    <text x="528" y="196">6-byte instruction queue</text>
    <text x="528" y="228">256 interrupt vectors</text>
    <text x="528" y="260">~117 instruction types</text>
  </g>
  <g stroke="#9aa4ae" stroke-width="1" stroke-dasharray="3 3">
    <line x1="508" y1="96" x2="522" y2="96"/>
    <line x1="508" y1="128" x2="522" y2="128"/>
    <line x1="508" y1="160" x2="522" y2="160"/>
    <line x1="508" y1="192" x2="522" y2="192"/>
    <line x1="508" y1="224" x2="522" y2="224"/>
    <line x1="508" y1="256" x2="522" y2="256"/>
  </g>

  <text x="380" y="334" text-anchor="middle" font-size="12" fill="#6b747e" font-style="italic">
    Introduced June 1978. Still the mode every x86 processor powers on into.
  </text>
</svg>
