<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="620" fill="#fbfaf7"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" fill="#23303c">A complete minimum-mode 8086 system</text>

  <defs>
    <marker id="m14" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#23303c"/>
    </marker>
    <marker id="m14g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#2f6f6b"/>
    </marker>
  </defs>

  <!-- 8284 -->
  <rect x="40" y="70" width="110" height="96" rx="4" fill="#eceae4" stroke="#23303c" stroke-width="1.6"/>
  <text x="95" y="94" text-anchor="middle" font-size="14" fill="#23303c">8284A</text>
  <text x="95" y="112" text-anchor="middle" font-size="10.5" fill="#6b747e">clock · reset</text>
  <text x="95" y="126" text-anchor="middle" font-size="10.5" fill="#6b747e">ready</text>
  <text x="95" y="150" text-anchor="middle" font-size="10.5" fill="#b4562d">15 MHz xtal</text>

  <!-- 8086 -->
  <rect x="200" y="70" width="140" height="200" rx="4" fill="#2b3440" stroke="#151c24" stroke-width="2"/>
  <text x="270" y="100" text-anchor="middle" font-size="17" fill="#f2efe8">8086</text>
  <text x="270" y="120" text-anchor="middle" font-size="11" fill="#b9c2cc">minimum mode</text>
  <text x="270" y="138" text-anchor="middle" font-size="10.5" fill="#b4562d">MN/MX → +5 V</text>
  <g font-size="10.5" fill="#b9c2cc" font-family="monospace">
    <text x="332" y="168" text-anchor="end">ALE</text>
    <text x="332" y="186" text-anchor="end">AD15–AD0</text>
    <text x="332" y="204" text-anchor="end">A19–A16, BHE</text>
    <text x="332" y="222" text-anchor="end">DT/R, DEN</text>
    <text x="332" y="240" text-anchor="end">RD, WR, M/IO</text>
  </g>
  <line x1="150" y1="100" x2="198" y2="100" stroke="#23303c" stroke-width="1.6" marker-end="url(#m14)"/>
  <text x="174" y="94" text-anchor="middle" font-size="9.5" fill="#6b747e">CLK</text>

  <!-- latches -->
  <rect x="400" y="70" width="140" height="76" rx="4" fill="#e4eaee" stroke="#23303c" stroke-width="1.6"/>
  <text x="470" y="94" text-anchor="middle" font-size="13.5" fill="#23303c">3 × 74LS373</text>
  <text x="470" y="112" text-anchor="middle" font-size="10.5" fill="#6b747e">address latches</text>
  <text x="470" y="130" text-anchor="middle" font-size="10.5" fill="#b4562d">LE ← ALE, OE ← GND</text>

  <!-- transceivers -->
  <rect x="400" y="176" width="140" height="76" rx="4" fill="#e4eaee" stroke="#23303c" stroke-width="1.6"/>
  <text x="470" y="200" text-anchor="middle" font-size="13.5" fill="#23303c">2 × 74LS245</text>
  <text x="470" y="218" text-anchor="middle" font-size="10.5" fill="#6b747e">data transceivers</text>
  <text x="470" y="236" text-anchor="middle" font-size="10.5" fill="#b4562d">DIR ← DT/R, OE ← DEN</text>

  <!-- arrows CPU -> latches / transceivers -->
  <line x1="340" y1="108" x2="398" y2="108" stroke="#23303c" stroke-width="2.4" marker-end="url(#m14)"/>
  <line x1="340" y1="212" x2="398" y2="212" stroke="#23303c" stroke-width="2.4" marker-end="url(#m14)"/>
  <line x1="398" y1="224" x2="340" y2="224" stroke="#23303c" stroke-width="2.4" marker-end="url(#m14)"/>

  <!-- decoder -->
  <rect x="400" y="282" width="140" height="70" rx="4" fill="#e4eaee" stroke="#23303c" stroke-width="1.6"/>
  <text x="470" y="306" text-anchor="middle" font-size="13.5" fill="#23303c">74LS138 + ’139</text>
  <text x="470" y="324" text-anchor="middle" font-size="10.5" fill="#6b747e">address decode</text>
  <text x="470" y="342" text-anchor="middle" font-size="10.5" fill="#6b747e">+ even/odd bank select</text>
  <path d="M470 146 V 282" fill="none" stroke="#2f6f6b" stroke-width="2" marker-end="url(#m14g)"/>
  <text x="482" y="216" font-size="10" fill="#2f6f6b">A19–A17</text>

  <!-- buses -->
  <line x1="60" y1="404" x2="860" y2="404" stroke="#2f6f6b" stroke-width="4"/>
  <text x="64" y="396" font-size="12" fill="#2f6f6b">address bus A19–A0 (latched)</text>
  <line x1="60" y1="436" x2="860" y2="436" stroke="#23303c" stroke-width="4"/>
  <text x="64" y="428" font-size="12" fill="#23303c">data bus D15–D0 (buffered)</text>
  <line x1="60" y1="468" x2="860" y2="468" stroke="#b4562d" stroke-width="3"/>
  <text x="64" y="460" font-size="12" fill="#b4562d">control: RD, WR, M/IO, chip selects</text>

  <line x1="470" y1="146" x2="470" y2="404" stroke="#2f6f6b" stroke-width="2.4"/>
  <line x1="470" y1="252" x2="470" y2="436" stroke="#23303c" stroke-width="2.4"/>
  <line x1="470" y1="352" x2="470" y2="468" stroke="#b4562d" stroke-width="2"/>
  <line x1="270" y1="270" x2="270" y2="468" stroke="#b4562d" stroke-width="2"/>

  <!-- devices -->
  <g stroke="#23303c" stroke-width="1.6">
    <rect x="90" y="500" width="120" height="70" rx="4" fill="#eceae4"/>
    <rect x="240" y="500" width="120" height="70" rx="4" fill="#eceae4"/>
    <rect x="390" y="500" width="110" height="70" rx="4" fill="#f2e7df"/>
    <rect x="530" y="500" width="110" height="70" rx="4" fill="#f2e7df"/>
    <rect x="670" y="500" width="110" height="70" rx="4" fill="#f2e7df"/>
  </g>
  <g text-anchor="middle" fill="#23303c">
    <text x="150" y="524" font-size="13">2 × 2764</text>
    <text x="150" y="542" font-size="10.5" fill="#6b747e">16 KiB EPROM</text>
    <text x="150" y="560" font-size="10.5" fill="#b4562d">FC000–FFFFF</text>
    <text x="300" y="524" font-size="13">2 × 6264</text>
    <text x="300" y="542" font-size="10.5" fill="#6b747e">16 KiB SRAM</text>
    <text x="300" y="560" font-size="10.5" fill="#b4562d">00000–03FFF</text>
    <text x="445" y="524" font-size="13">8255A</text>
    <text x="445" y="542" font-size="10.5" fill="#6b747e">parallel I/O</text>
    <text x="585" y="524" font-size="13">8253</text>
    <text x="585" y="542" font-size="10.5" fill="#6b747e">timer</text>
    <text x="725" y="524" font-size="13">8259A</text>
    <text x="725" y="542" font-size="10.5" fill="#6b747e">interrupts</text>
  </g>
  <g stroke="#6b747e" stroke-width="1.4">
    <line x1="150" y1="468" x2="150" y2="500"/>
    <line x1="300" y1="468" x2="300" y2="500"/>
    <line x1="445" y1="468" x2="445" y2="500"/>
    <line x1="585" y1="468" x2="585" y2="500"/>
    <line x1="725" y1="468" x2="725" y2="500"/>
  </g>
  <path d="M725 500 V 486 H 830 V 250 H 344" fill="none" stroke="#b4562d" stroke-width="1.6" marker-end="url(#m14)" stroke-dasharray="5 3"/>
  <text x="838" y="360" font-size="10.5" fill="#b4562d" transform="rotate(-90 838 360)">INT → INTR</text>

  <text x="450" y="600" text-anchor="middle" font-size="12" fill="#6b747e" font-style="italic">
    ROM must cover 0xFFFF0 because that is where the CPU fetches first; RAM must cover 0x00000 because that is where the interrupt vectors live.
  </text>
</svg>
