<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="Georgia, 'Times New Roman', serif">
  <rect width="800" height="440" fill="#fbfaf7"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" fill="#23303c">8279 — it refreshes the display and scans the keys for you</text>

  <defs>
    <marker id="a53" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#23303c"/>
    </marker>
  </defs>

  <rect x="60" y="76" width="120" height="90" rx="4" fill="#2b3440" stroke="#151c24" stroke-width="1.8"/>
  <text x="120" y="112" text-anchor="middle" font-size="15" fill="#f2efe8">8086</text>
  <text x="120" y="134" text-anchor="middle" font-size="10.5" fill="#b9c2cc">writes once,</text>
  <text x="120" y="150" text-anchor="middle" font-size="10.5" fill="#b9c2cc">then forgets</text>

  <rect x="280" y="62" width="200" height="290" rx="5" fill="#eceae4" stroke="#23303c" stroke-width="2"/>
  <text x="380" y="88" text-anchor="middle" font-size="16" fill="#23303c">8279</text>
  <line x1="280" y1="98" x2="480" y2="98" stroke="#9aa4ae"/>

  <rect x="298" y="110" width="164" height="56" rx="3" fill="#e4eaee" stroke="#8a939d"/>
  <text x="380" y="130" text-anchor="middle" font-size="12" fill="#23303c">display RAM — 16 bytes</text>
  <text x="380" y="148" text-anchor="middle" font-size="10.5" fill="#b4562d">refreshed automatically</text>

  <rect x="298" y="176" width="164" height="56" rx="3" fill="#dfe6ea" stroke="#8a939d"/>
  <text x="380" y="196" text-anchor="middle" font-size="12" fill="#23303c">scan counter</text>
  <text x="380" y="214" text-anchor="middle" font-size="10.5" fill="#6b747e">drives SL0–SL3</text>

  <rect x="298" y="242" width="164" height="56" rx="3" fill="#f2e7df" stroke="#8a939d"/>
  <text x="380" y="262" text-anchor="middle" font-size="12" fill="#23303c">keyboard FIFO</text>
  <text x="380" y="280" text-anchor="middle" font-size="10.5" fill="#b4562d">8 keys, debounced</text>

  <rect x="298" y="308" width="164" height="34" rx="3" fill="#dfe6ea" stroke="#8a939d"/>
  <text x="380" y="330" text-anchor="middle" font-size="11" fill="#6b747e">control · 100 kHz internal clock</text>

  <!-- CPU links -->
  <line x1="182" y1="104" x2="278" y2="104" stroke="#23303c" stroke-width="2" marker-end="url(#a53)"/>
  <text x="230" y="98" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#23303c">D7–D0</text>
  <line x1="182" y1="140" x2="278" y2="140" stroke="#23303c" stroke-width="2" marker-end="url(#a53)"/>
  <text x="230" y="134" text-anchor="middle" font-size="10.5" font-family="monospace" fill="#23303c">A0 CS RD WR</text>
  <path d="M278 268 C 230 268 200 200 182 166" fill="none" stroke="#b4562d" stroke-width="2" marker-end="url(#a53)"/>
  <text x="222" y="246" font-size="10.5" font-family="monospace" fill="#b4562d">IRQ</text>

  <!-- display -->
  <g stroke="#23303c" stroke-width="1.5">
    <rect x="560" y="86" width="40" height="60" rx="3" fill="#2b3440"/>
    <rect x="606" y="86" width="40" height="60" rx="3" fill="#2b3440"/>
    <rect x="652" y="86" width="40" height="60" rx="3" fill="#2b3440"/>
    <rect x="698" y="86" width="40" height="60" rx="3" fill="#2b3440"/>
  </g>
  <g text-anchor="middle" font-size="24" fill="#f4a24d" font-family="monospace">
    <text x="580" y="128">8</text><text x="626" y="128">2</text>
    <text x="672" y="128">7</text><text x="718" y="128">9</text>
  </g>
  <text x="649" y="166" text-anchor="middle" font-size="11" fill="#6b747e">up to 16 digits</text>
  <line x1="482" y1="120" x2="556" y2="116" stroke="#2f6f6b" stroke-width="2.4" marker-end="url(#a53)"/>
  <text x="519" y="106" text-anchor="middle" font-size="10" font-family="monospace" fill="#2f6f6b">OUT A/B</text>

  <!-- keypad -->
  <g stroke="#23303c" stroke-width="1.4" fill="#e4eaee">
    <rect x="560" y="212" width="34" height="30" rx="3"/><rect x="600" y="212" width="34" height="30" rx="3"/>
    <rect x="640" y="212" width="34" height="30" rx="3"/><rect x="680" y="212" width="34" height="30" rx="3"/>
    <rect x="560" y="248" width="34" height="30" rx="3"/><rect x="600" y="248" width="34" height="30" rx="3"/>
    <rect x="640" y="248" width="34" height="30" rx="3"/><rect x="680" y="248" width="34" height="30" rx="3"/>
    <rect x="560" y="284" width="34" height="30" rx="3"/><rect x="600" y="284" width="34" height="30" rx="3"/>
    <rect x="640" y="284" width="34" height="30" rx="3"/><rect x="680" y="284" width="34" height="30" rx="3"/>
  </g>
  <text x="637" y="334" text-anchor="middle" font-size="11" fill="#6b747e">up to 64 keys</text>
  <line x1="556" y1="264" x2="482" y2="268" stroke="#b4562d" stroke-width="2.4" marker-end="url(#a53)"/>
  <text x="519" y="256" text-anchor="middle" font-size="10" font-family="monospace" fill="#b4562d">RL0–RL7</text>

  <rect x="60" y="372" width="680" height="54" rx="4" fill="#f4f2ec" stroke="#cfd5da"/>
  <text x="400" y="392" text-anchor="middle" font-size="12.5" fill="#23303c">
    Multiplexing with an 8255 needs the processor to refresh every few milliseconds, for ever.
  </text>
  <text x="400" y="412" text-anchor="middle" font-size="12.5" fill="#b4562d">
    The 8279 needs eight writes — once, when the value changes. The same argument as the 8253 and DMA.
  </text>
</svg>
