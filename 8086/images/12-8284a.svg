<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="Georgia, 'Times New Roman', serif">
  <rect width="800" height="470" fill="#fbfaf7"/>
  <text x="400" y="30" text-anchor="middle" font-size="18" fill="#23303c">The 8284A — one chip, three jobs</text>

  <defs>
    <marker id="a12" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#23303c"/>
    </marker>
  </defs>

  <!-- chip -->
  <rect x="290" y="88" width="190" height="290" rx="4" fill="#eceae4" stroke="#23303c" stroke-width="2"/>
  <text x="385" y="116" text-anchor="middle" font-size="17" fill="#23303c">8284A</text>
  <line x1="290" y1="128" x2="480" y2="128" stroke="#9aa4ae"/>

  <!-- internal blocks -->
  <rect x="306" y="140" width="158" height="52" rx="3" fill="#dfe6ea" stroke="#8a939d"/>
  <text x="385" y="162" text-anchor="middle" font-size="12" fill="#23303c">oscillator ÷ 3</text>
  <text x="385" y="180" text-anchor="middle" font-size="11" fill="#6b747e">produces the 33% duty cycle</text>

  <rect x="306" y="206" width="158" height="52" rx="3" fill="#dfe6ea" stroke="#8a939d"/>
  <text x="385" y="228" text-anchor="middle" font-size="12" fill="#23303c">reset synchroniser</text>
  <text x="385" y="246" text-anchor="middle" font-size="11" fill="#6b747e">Schmitt trigger + flip-flop</text>

  <rect x="306" y="272" width="158" height="52" rx="3" fill="#dfe6ea" stroke="#8a939d"/>
  <text x="385" y="294" text-anchor="middle" font-size="12" fill="#23303c">ready synchroniser</text>
  <text x="385" y="312" text-anchor="middle" font-size="11" fill="#6b747e">stops metastability</text>

  <!-- crystal -->
  <rect x="120" y="126" width="80" height="40" rx="3" fill="#f2e7df" stroke="#23303c" stroke-width="1.4"/>
  <text x="160" y="143" text-anchor="middle" font-size="12" fill="#23303c">crystal</text>
  <text x="160" y="159" text-anchor="middle" font-size="12" fill="#b4562d">15 MHz</text>
  <line x1="200" y1="140" x2="288" y2="140" stroke="#23303c" stroke-width="1.6" marker-end="url(#a12)"/>
  <line x1="200" y1="156" x2="288" y2="156" stroke="#23303c" stroke-width="1.6" marker-end="url(#a12)"/>
  <text x="244" y="134" text-anchor="middle" font-size="11" fill="#6b747e">X1</text>
  <text x="244" y="174" text-anchor="middle" font-size="11" fill="#6b747e">X2</text>
  <text x="160" y="184" text-anchor="middle" font-size="11" fill="#6b747e">3 × the CPU frequency</text>

  <!-- RC network -->
  <line x1="160" y1="232" x2="288" y2="232" stroke="#23303c" stroke-width="1.6" marker-end="url(#a12)"/>
  <text x="222" y="224" text-anchor="middle" font-size="11" fill="#6b747e">RES</text>
  <line x1="208" y1="215" x2="236" y2="215" stroke="#23303c" stroke-width="1.2"/>
  <text x="150" y="236" text-anchor="end" font-size="12" fill="#23303c">RC network + button</text>
  <text x="150" y="252" text-anchor="end" font-size="11" fill="#6b747e">τ ≈ 1 s</text>

  <!-- ready in -->
  <line x1="180" y1="298" x2="288" y2="298" stroke="#23303c" stroke-width="1.6" marker-end="url(#a12)"/>
  <text x="234" y="290" text-anchor="middle" font-size="11" fill="#6b747e">RDY1</text>
  <text x="172" y="302" text-anchor="end" font-size="12" fill="#23303c">wait-state logic</text>
  <line x1="180" y1="322" x2="288" y2="322" stroke="#23303c" stroke-width="1.6" marker-end="url(#a12)"/>
  <text x="234" y="340" text-anchor="middle" font-size="11" fill="#6b747e">AEN1 = GND</text>

  <!-- outputs -->
  <g stroke="#23303c" stroke-width="1.6" marker-end="url(#a12)">
    <line x1="480" y1="150" x2="590" y2="150"/>
    <line x1="480" y1="178" x2="590" y2="178"/>
    <line x1="480" y1="206" x2="590" y2="206"/>
    <line x1="480" y1="266" x2="590" y2="266"/>
    <line x1="480" y1="316" x2="590" y2="316"/>
  </g>

  <g font-size="12.5" fill="#23303c">
    <text x="596" y="146">CLK</text>
    <text x="596" y="174">OSC</text>
    <text x="596" y="202">PCLK</text>
    <text x="596" y="262">RESET</text>
    <text x="596" y="312">READY</text>
  </g>
  <g font-size="11" fill="#6b747e">
    <text x="596" y="162">5 MHz, 33% duty, MOS — 8086, 8288, 8087</text>
    <text x="596" y="190">15 MHz, TTL — spare</text>
    <text x="596" y="218">2.5 MHz, 50%, TTL — 8253, 8251</text>
    <text x="596" y="278">synchronised, active high —</text>
    <text x="596" y="294">to the CPU and every peripheral</text>
    <text x="596" y="328">synchronised — low inserts a wait state</text>
  </g>

  <rect x="60" y="400" width="680" height="50" rx="4" fill="#f4f2ec" stroke="#cfd5da"/>
  <text x="400" y="422" text-anchor="middle" font-size="12.5" fill="#23303c">
    A crystal and a gate cannot replace this chip: the 8086 needs a 33% duty cycle, MOS voltage levels,
  </text>
  <text x="400" y="440" text-anchor="middle" font-size="12.5" fill="#23303c">
    a reset edge aligned to the clock, and a READY input that never changes inside its setup window.
  </text>
</svg>
