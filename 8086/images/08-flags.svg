<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" font-family="Georgia, 'Times New Roman', serif">
  <rect width="860" height="480" fill="#fbfaf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="18" fill="#23303c">The FLAGS register — nine meaningful bits out of sixteen</text>

  <!-- bit numbers -->
  <g font-size="11" fill="#6b747e" font-family="monospace" text-anchor="middle">
    <text x="70" y="72">15</text><text x="118" y="72">14</text><text x="166" y="72">13</text>
    <text x="214" y="72">12</text><text x="262" y="72">11</text><text x="310" y="72">10</text>
    <text x="358" y="72">9</text><text x="406" y="72">8</text><text x="454" y="72">7</text>
    <text x="502" y="72">6</text><text x="550" y="72">5</text><text x="598" y="72">4</text>
    <text x="646" y="72">3</text><text x="694" y="72">2</text><text x="742" y="72">1</text>
    <text x="790" y="72">0</text>
  </g>

  <!-- cells -->
  <g stroke="#23303c" stroke-width="1.4">
    <rect x="46" y="80" width="48" height="42" fill="#eceae4"/>
    <rect x="94" y="80" width="48" height="42" fill="#eceae4"/>
    <rect x="142" y="80" width="48" height="42" fill="#eceae4"/>
    <rect x="190" y="80" width="48" height="42" fill="#eceae4"/>
    <rect x="238" y="80" width="48" height="42" fill="#dfe6ea"/>
    <rect x="286" y="80" width="48" height="42" fill="#f2e7df"/>
    <rect x="334" y="80" width="48" height="42" fill="#f2e7df"/>
    <rect x="382" y="80" width="48" height="42" fill="#f2e7df"/>
    <rect x="430" y="80" width="48" height="42" fill="#dfe6ea"/>
    <rect x="478" y="80" width="48" height="42" fill="#dfe6ea"/>
    <rect x="526" y="80" width="48" height="42" fill="#eceae4"/>
    <rect x="574" y="80" width="48" height="42" fill="#dfe6ea"/>
    <rect x="622" y="80" width="48" height="42" fill="#eceae4"/>
    <rect x="670" y="80" width="48" height="42" fill="#dfe6ea"/>
    <rect x="718" y="80" width="48" height="42" fill="#eceae4"/>
    <rect x="766" y="80" width="48" height="42" fill="#dfe6ea"/>
  </g>

  <g font-size="14" font-family="monospace" text-anchor="middle" fill="#23303c">
    <text x="262" y="106">OF</text><text x="310" y="106">DF</text>
    <text x="358" y="106">IF</text><text x="406" y="106">TF</text>
    <text x="454" y="106">SF</text><text x="502" y="106">ZF</text>
    <text x="598" y="106">AF</text><text x="694" y="106">PF</text>
    <text x="790" y="106">CF</text>
  </g>
  <g font-size="12" font-family="monospace" text-anchor="middle" fill="#9aa4ae">
    <text x="70" y="106">—</text><text x="118" y="106">—</text>
    <text x="166" y="106">—</text><text x="214" y="106">—</text>
    <text x="550" y="106">0</text><text x="646" y="106">0</text><text x="742" y="106">1</text>
  </g>

  <!-- groupings -->
  <line x1="46" y1="132" x2="238" y2="132" stroke="#9aa4ae" stroke-width="1.4"/>
  <text x="142" y="148" text-anchor="middle" font-size="11.5" fill="#6b747e">undefined on the 8086</text>
  <line x1="286" y1="132" x2="430" y2="132" stroke="#b4562d" stroke-width="1.6"/>
  <text x="358" y="148" text-anchor="middle" font-size="11.5" fill="#b4562d">control — you set these</text>
  <text x="526" y="148" text-anchor="middle" font-size="11.5" fill="#2f6f6b">status — the processor sets these</text>
  <line x1="430" y1="132" x2="814" y2="132" stroke="#2f6f6b" stroke-width="1.6" stroke-dasharray="0"/>

  <!-- descriptions -->
  <g font-size="13" fill="#23303c">
    <text x="60" y="196" font-family="monospace" fill="#b4562d">CF</text>
    <text x="110" y="196">carry — unsigned overflow, borrow, or the bit shifted out</text>
    <text x="640" y="196" font-size="11.5" fill="#6b747e" font-family="monospace">JC JNC JB JAE</text>

    <text x="60" y="224" font-family="monospace" fill="#b4562d">PF</text>
    <text x="110" y="224">parity — an even number of 1 bits in the LOW BYTE of the result</text>
    <text x="640" y="224" font-size="11.5" fill="#6b747e" font-family="monospace">JP JNP</text>

    <text x="60" y="252" font-family="monospace" fill="#b4562d">AF</text>
    <text x="110" y="252">auxiliary carry — carry out of bit 3; used only by BCD adjusts</text>
    <text x="640" y="252" font-size="11.5" fill="#6b747e" font-family="monospace">(no jump exists)</text>

    <text x="60" y="280" font-family="monospace" fill="#b4562d">ZF</text>
    <text x="110" y="280">zero — the result is exactly zero</text>
    <text x="640" y="280" font-size="11.5" fill="#6b747e" font-family="monospace">JZ JNZ JE JNE</text>

    <text x="60" y="308" font-family="monospace" fill="#b4562d">SF</text>
    <text x="110" y="308">sign — a copy of the result's most significant bit</text>
    <text x="640" y="308" font-size="11.5" fill="#6b747e" font-family="monospace">JS JNS</text>

    <text x="60" y="336" font-family="monospace" fill="#b4562d">OF</text>
    <text x="110" y="336">overflow — signed overflow: carry into MSB ≠ carry out of it</text>
    <text x="640" y="336" font-size="11.5" fill="#6b747e" font-family="monospace">JO JNO</text>

    <text x="60" y="372" font-family="monospace" fill="#2f6f6b">TF</text>
    <text x="110" y="372">trap — 1 causes INT 1 after every instruction (single step)</text>
    <text x="640" y="372" font-size="11.5" fill="#6b747e" font-family="monospace">via PUSHF/POPF</text>

    <text x="60" y="400" font-family="monospace" fill="#2f6f6b">IF</text>
    <text x="110" y="400">interrupt enable — 1 accepts maskable interrupts on INTR</text>
    <text x="640" y="400" font-size="11.5" fill="#6b747e" font-family="monospace">CLI / STI</text>

    <text x="60" y="428" font-family="monospace" fill="#2f6f6b">DF</text>
    <text x="110" y="428">direction — 0 makes string instructions count SI/DI upwards</text>
    <text x="640" y="428" font-size="11.5" fill="#6b747e" font-family="monospace">CLD / STD</text>
  </g>

  <text x="430" y="462" text-anchor="middle" font-size="12" fill="#6b747e" font-style="italic">
    CF describes the unsigned reading of a result; OF describes the signed one. The same addition sets both.
  </text>
</svg>
